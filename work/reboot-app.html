<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0C0C">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/work/reboot/symbol.svg" type="image/svg+xml">
<title>RE:BOOT App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&family=Michroma&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
  /* Layout: 검정 바탕 위 오렌지 빛 번짐 + 반투명 유리 패널. 데스크톱은 소개 + 폰, 모바일은 앱 전체 화면 */
  :root {
    --void: #070707;
    --black: #0C0C0C;
    --glass: rgba(255, 255, 255, .055);
    --glass-hi: rgba(255, 255, 255, .09);
    --edge: rgba(255, 255, 255, .11);
    --hair: rgba(255, 255, 255, .07);
    --text: #F4F3F0;
    --soft: rgba(244, 243, 240, .62);
    --mute: rgba(244, 243, 240, .38);
    --orange: #FF5A1F;
    --amber: #FF9A5C;
    --glow: rgba(255, 90, 31, .45);
    --ui: "Geist", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --wide: "Michroma", "Geist", sans-serif;
    --ease: cubic-bezier(.22, .8, .2, 1);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--void); color: var(--text); font: 400 14px/1.55 var(--ui); -webkit-font-smoothing: antialiased; word-break: keep-all; letter-spacing: -.005em; }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: inherit; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 1.5px solid var(--amber); outline-offset: 3px; }
  .mark { color: var(--text); }
  .num { font-family: "Geist", sans-serif; font-weight: 200; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }

  /* 유리 */
  .glass {
    position: relative;
    background: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.03) 45%, rgba(255,255,255,.05));
    -webkit-backdrop-filter: blur(28px) saturate(170%);
    backdrop-filter: blur(28px) saturate(170%);
    border: 1px solid var(--edge);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(255,255,255,.03), 0 18px 40px rgba(0,0,0,.35);
    border-radius: 26px;
  }
  .press { transition: transform .25s var(--ease), background .25s; }
  .press:active { transform: scale(.975); }

  /* 스테이지 */
  .stage { min-height: 100%; display: grid; grid-template-columns: minmax(0, 400px) auto; justify-content: center; align-items: center; gap: 96px; padding: 32px 16px; position: relative; overflow: hidden; }
  .stage::before { content: ""; position: absolute; width: 900px; height: 900px; right: 8%; top: 50%; transform: translateY(-50%); background: radial-gradient(circle, rgba(255,90,31,.16), transparent 62%); pointer-events: none; }
  .intro { position: relative; display: grid; gap: 26px; }
  .intro__logo { display: flex; align-items: center; gap: 12px; }
  .intro__logo svg { width: 26px; height: 29px; }
  .intro__logo span { font-family: var(--wide); font-size: 15px; letter-spacing: .04em; }
  .intro h1 { margin: 0; font-weight: 300; font-size: 44px; line-height: 1.12; letter-spacing: -.035em; text-wrap: balance; }
  .intro h1 b { font-weight: 500; background: linear-gradient(90deg, var(--orange), var(--amber)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .intro p { margin: 0; color: var(--soft); font-size: 15px; line-height: 1.7; max-width: 36ch; }
  .intro ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .intro li { display: flex; gap: 12px; align-items: baseline; color: var(--soft); font-size: 13.5px; }
  .intro li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 10px var(--glow); flex: none; transform: translateY(-2px); }
  .intro small { color: var(--mute); font-size: 12px; }

  .phone { position: relative; width: 392px; height: min(848px, calc(100vh - 64px)); min-height: 660px; border-radius: 56px; padding: 10px; background: linear-gradient(145deg, #2a2a2a, #0d0d0d 40%, #1c1c1c); box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 50px 100px rgba(0,0,0,.7); }
  .app { position: relative; height: 100%; border-radius: 47px; overflow: hidden; background: var(--black); isolation: isolate; }

  @media (max-width: 880px) {
    .stage { display: block; padding: 0; height: 100%; }
    .stage::before, .intro { display: none; }
    .phone { width: 100%; height: 100%; min-height: 0; border-radius: 0; padding: 0; background: none; box-shadow: none; }
    .app { border-radius: 0; }
  }

  /* 앰비언트 빛 */
  .amb { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .amb i { position: absolute; border-radius: 50%; filter: blur(60px); }
  .amb i:nth-child(1) { width: 340px; height: 340px; left: -120px; top: -90px; background: radial-gradient(circle, rgba(255,90,31,.55), transparent 70%); animation: drift1 18s ease-in-out infinite alternate; }
  .amb i:nth-child(2) { width: 300px; height: 300px; right: -140px; top: 38%; background: radial-gradient(circle, rgba(255,140,70,.32), transparent 70%); animation: drift2 22s ease-in-out infinite alternate; }
  .amb i:nth-child(3) { width: 260px; height: 260px; left: 10%; bottom: -120px; background: radial-gradient(circle, rgba(255,255,255,.08), transparent 70%); }
  @keyframes drift1 { to { transform: translate(60px, 50px) scale(1.1); } }
  @keyframes drift2 { to { transform: translate(-50px, -70px) scale(.9); } }

  /* 상단 */
  .top { position: absolute; z-index: 3; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 10px; }
  .top > svg { width: 18px; height: 20px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 20px; font-size: 12.5px; color: var(--soft); }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 8px var(--orange); }
  .chip b { color: var(--text); font-weight: 500; }

  .view { position: absolute; inset: 0; z-index: 1; overflow-y: auto; padding: calc(74px + env(safe-area-inset-top, 0px)) 18px calc(120px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; }
  .view::-webkit-scrollbar { display: none; }
  .view > * { flex-shrink: 0; }
  .eyebrow { font-size: 12.5px; color: var(--mute); margin: 0; }
  .title { margin: 0; font-weight: 300; font-size: 32px; line-height: 1.15; letter-spacing: -.035em; text-wrap: balance; }
  .title b { font-weight: 500; }
  .title em { font-style: normal; font-weight: 500; background: linear-gradient(90deg, var(--orange), var(--amber)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sec-h { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; margin-top: 10px; }
  .sec-h h3 { margin: 0; font-size: 13px; font-weight: 500; color: var(--soft); }
  .sec-h span { font-size: 12px; color: var(--mute); }
  .pad { padding: 18px; }
  .cta { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 56px; border-radius: 28px; font-weight: 500; font-size: 15px; color: #fff; background: linear-gradient(180deg, #FF7440, var(--orange)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 30px rgba(255,90,31,.35); }
  .cta svg { width: 16px; height: 16px; }
  .cta[disabled] { background: rgba(255,255,255,.08); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); color: var(--mute); cursor: default; }
  .link { display: block; width: 100%; text-align: center; padding: 14px; font-size: 13.5px; color: var(--soft); border-radius: 22px; }
  .note { font-size: 12px; color: var(--mute); text-align: center; margin: 0; }

  /* 탭바 */
  .tabs { position: absolute; z-index: 4; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); height: 68px; border-radius: 34px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; }
  .tabs .thumb { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 4); border-radius: 28px; background: rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); transition: transform .45s var(--ease); }
  .tabs button { position: relative; display: grid; place-content: center; justify-items: center; gap: 3px; font-size: 10.5px; color: var(--mute); transition: color .3s; }
  .tabs svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tabs button[aria-current="page"] { color: var(--text); }
  .tabs button[aria-current="page"] svg { stroke: var(--orange); filter: drop-shadow(0 0 6px var(--glow)); }

  /* 홈 */
  .sample { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 10px 10px 16px; border-radius: 20px; font-size: 12.5px; color: var(--soft); }
  .sample button { flex: none; height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(255,90,31,.16); color: var(--amber); font-weight: 500; font-size: 12px; }
  .ring-card { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; padding: 20px; }
  .ring { position: relative; width: 132px; height: 132px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
  .ring .track { stroke: rgba(255,255,255,.07); }
  .ring .val { stroke: url(#rg); filter: drop-shadow(0 0 8px var(--glow)); transition: stroke-dashoffset .9s var(--ease); }
  .ring > div { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .num { font-size: 40px; line-height: 1; }
  .ring .num small { font-size: 16px; color: var(--soft); margin-left: 1px; }
  .ring span { font-size: 11px; color: var(--mute); margin-top: 4px; }
  .ring-card dl { margin: 0; display: grid; gap: 12px; }
  .ring-card dt { font-size: 11.5px; color: var(--mute); }
  .ring-card dd { margin: 2px 0 0; font-size: 15px; font-weight: 500; }
  .ring-card dd small { font-weight: 400; color: var(--soft); font-size: 12px; margin-left: 4px; }

  .look { overflow: hidden; padding: 20px; min-height: 168px; display: flex; flex-direction: column; }
  .look .orb { position: absolute; right: -40px; top: -50px; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFB27F, var(--orange) 45%, rgba(255,90,31,0) 72%); opacity: .8; filter: blur(4px); }
  .look .chev { position: absolute; right: 22px; top: 22px; width: 56px; color: rgba(255,255,255,.9); filter: drop-shadow(0 4px 12px rgba(0,0,0,.25)); }
  .look small { position: relative; font-size: 11.5px; color: var(--soft); }
  .look b { position: relative; margin-top: auto; font-size: 22px; font-weight: 500; letter-spacing: -.03em; }
  .look p { position: relative; margin: 4px 0 0; font-size: 13px; color: var(--soft); max-width: 30ch; }
  .tags { position: relative; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tags span { font-size: 11.5px; padding: 5px 11px; border-radius: 14px; background: rgba(255,255,255,.07); border: 1px solid var(--hair); color: var(--soft); }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); padding: 18px 14px; }
  .week div { display: grid; justify-items: center; gap: 8px; font-size: 11px; color: var(--mute); }
  .dot { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.12); }
  .dot.half { border-color: var(--orange); background: radial-gradient(circle, rgba(255,90,31,.3), transparent 70%); }
  .dot.full { border-color: transparent; background: linear-gradient(160deg, var(--amber), var(--orange)); box-shadow: 0 0 12px var(--glow); }
  .week .today { color: var(--text); font-weight: 500; }
  .tip { padding: 18px 20px; font-size: 14px; line-height: 1.6; color: var(--soft); }
  .tip b { color: var(--text); font-weight: 500; }
  .tip small { display: block; font-size: 11.5px; color: var(--amber); margin-bottom: 6px; }

  /* 루틴 */
  .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; height: 46px; padding: 4px; border-radius: 23px; }
  .seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 19px; background: rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 4px 12px rgba(0,0,0,.25); transition: transform .45s var(--ease); }
  .seg.pm .thumb { transform: translateX(100%); }
  .seg button { position: relative; text-align: center; font-size: 13px; color: var(--mute); transition: color .3s; }
  .seg button[aria-pressed="true"] { color: var(--text); font-weight: 500; }
  .meta-line { display: flex; gap: 16px; color: var(--soft); font-size: 13px; padding: 0 4px; }
  .meta-line b { font-weight: 500; color: var(--text); }
  .rows { padding: 6px 0; }
  .step { display: grid; grid-template-columns: 30px 1fr auto; gap: 14px; align-items: start; width: 100%; padding: 14px 18px; position: relative; }
  .step + .step::before { content: ""; position: absolute; top: 0; left: 62px; right: 18px; height: 1px; background: var(--hair); }
  .check { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.18); display: grid; place-items: center; transition: all .35s var(--ease); }
  .check svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .35s .05s var(--ease); }
  .step b { display: block; font-weight: 500; font-size: 15px; letter-spacing: -.02em; transition: color .3s; }
  .step span.why { display: block; font-size: 12.5px; color: var(--mute); margin-top: 3px; line-height: 1.5; }
  .step .t { font-size: 12px; color: var(--mute); padding-top: 6px; font-variant-numeric: tabular-nums; }
  .step .tag { display: inline-block; font-size: 10.5px; font-weight: 500; color: var(--amber); background: rgba(255,90,31,.14); border-radius: 8px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
  .step.done .check { border-color: transparent; background: linear-gradient(160deg, var(--amber), var(--orange)); box-shadow: 0 0 14px var(--glow); }
  .step.done .check svg { stroke-dashoffset: 0; }
  .step.done b { color: var(--mute); }
  .complete { padding: 22px; text-align: center; overflow: hidden; }
  .complete::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 120%, rgba(255,90,31,.35), transparent 65%); border-radius: inherit; }
  .complete b { position: relative; display: block; font-weight: 500; font-size: 17px; }
  .complete span { position: relative; font-size: 13px; color: var(--soft); }

  /* 가이드 */
  .prod { display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center; padding: 12px 18px; position: relative; }
  .prod + .prod::before { content: ""; position: absolute; top: 0; left: 78px; right: 18px; height: 1px; background: var(--hair); }
  .prod > i { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-style: normal; background: linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.03)); border: 1px solid var(--hair); font-size: 15px; font-weight: 300; color: var(--soft); }
  .prod > i.hot { background: linear-gradient(160deg, rgba(255,154,92,.35), rgba(255,90,31,.12)); color: var(--text); border-color: rgba(255,90,31,.3); }
  .prod b { display: block; font-weight: 500; font-size: 14.5px; }
  .prod span { display: block; font-size: 12px; color: var(--mute); }
  .prod em { font-style: normal; font-size: 12px; color: var(--soft); white-space: nowrap; }
  .kit { padding: 4px 0; }
  .kit div { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 14px 18px; position: relative; }
  .kit div + div::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; height: 1px; background: var(--hair); }
  .kit dt { font-size: 12px; color: var(--mute); padding-top: 1px; }
  .kit dd { margin: 0; font-size: 13.5px; color: var(--soft); line-height: 1.55; }
  .kit dd b { display: block; color: var(--text); font-weight: 500; font-size: 14.5px; margin-bottom: 2px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 2px; }
  .pills span { font-size: 12px; padding: 7px 12px; border-radius: 16px; color: var(--soft); }

  /* 나 */
  .me { display: flex; align-items: center; gap: 16px; padding: 18px; }
  .me__icon { width: 60px; height: 60px; border-radius: 20px; display: grid; place-items: center; flex: none; background: linear-gradient(160deg, #FF8248, var(--orange)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 24px rgba(255,90,31,.35); }
  .me__icon svg { width: 26px; height: 29px; }
  .me b { display: block; font-size: 19px; font-weight: 500; letter-spacing: -.02em; }
  .me span { font-size: 13px; color: var(--soft); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); padding: 18px 6px; }
  .stats div { text-align: center; position: relative; }
  .stats div + div::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: var(--hair); }
  .stats .num { display: block; font-size: 34px; line-height: 1.1; }
  .stats span { font-size: 11.5px; color: var(--mute); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px 0; justify-items: center; padding: 18px 12px; }
  .cal .dot { width: 22px; height: 22px; }

  /* 온보딩 */
  .prog { display: flex; gap: 6px; }
  .prog i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; position: relative; }
  .prog i.on::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--orange), var(--amber)); box-shadow: 0 0 8px var(--glow); }
  .styles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sty { overflow: hidden; min-height: 176px; padding: 16px; display: flex; flex-direction: column; border-radius: 24px; transition: transform .25s var(--ease), border-color .3s, box-shadow .3s; }
  .sty .o { position: absolute; width: 120px; height: 120px; border-radius: 50%; right: -30px; top: -30px; filter: blur(2px); opacity: .35; transition: opacity .4s, transform .6s var(--ease); }
  .sty small { position: relative; font-size: 11.5px; color: var(--mute); }
  .sty b { position: relative; margin-top: auto; font-size: 18px; font-weight: 500; letter-spacing: -.03em; }
  .sty span { position: relative; font-size: 12px; color: var(--soft); line-height: 1.45; margin-top: 4px; }
  .sty[aria-pressed="true"] { border-color: rgba(255,90,31,.6); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 0 0 1px rgba(255,90,31,.25), 0 14px 40px rgba(255,90,31,.22); }
  .sty[aria-pressed="true"] .o { opacity: .95; transform: scale(1.25); }
  .opt { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 22px; transition: border-color .3s, box-shadow .3s; }
  .opt .r { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.2); flex: none; display: grid; place-items: center; transition: all .3s var(--ease); }
  .opt.multi .r { border-radius: 7px; }
  .opt .r svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .opt div { display: grid; }
  .opt b { font-weight: 500; font-size: 15px; }
  .opt span { font-size: 12.5px; color: var(--mute); }
  .opt[aria-pressed="true"] { border-color: rgba(255,90,31,.55); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 10px 30px rgba(255,90,31,.15); }
  .opt[aria-pressed="true"] .r { border-color: transparent; background: linear-gradient(160deg, var(--amber), var(--orange)); box-shadow: 0 0 10px var(--glow); }
  .opt[aria-pressed="true"] .r svg { opacity: 1; }
  .ob-foot { margin-top: auto; display: grid; gap: 4px; padding-top: 16px; }

  /* 부팅 */
  .boot { position: absolute; inset: 0; z-index: 10; display: grid; place-content: center; justify-items: center; gap: 30px; background: rgba(8,8,8,.72); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); animation: fadein .4s var(--ease); }
  .boot__mark { position: relative; width: 120px; height: 120px; display: grid; place-items: center; }
  .boot__mark::before { content: ""; position: absolute; inset: -30px; border-radius: 50%; background: radial-gradient(circle, rgba(255,90,31,.45), transparent 65%); animation: pulse 1.6s ease-in-out infinite; }
  .boot__mark svg { position: relative; width: 64px; height: 72px; }
  .boot__bar { width: 180px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
  .boot__bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--orange), var(--amber)); box-shadow: 0 0 10px var(--glow); transition: width .6s var(--ease); }
  .boot p { margin: 0; font-size: 13px; color: var(--soft); min-height: 1.5em; }
  @keyframes pulse { 50% { transform: scale(1.15); opacity: .6; } }
  @keyframes fadein { from { opacity: 0; } }

  .enter > * { animation: rise .55s var(--ease) backwards; }
  .enter > *:nth-child(2) { animation-delay: .04s; } .enter > *:nth-child(3) { animation-delay: .08s; } .enter > *:nth-child(4) { animation-delay: .12s; } .enter > *:nth-child(5) { animation-delay: .16s; } .enter > *:nth-child(n+6) { animation-delay: .2s; }

      '<section class="rows glass">' + list.map(function (s, i) {
        var on = done.indexOf(i) > -1;
        return '<button class="step' + (on ? " done" : "") + '" data-step="' + i + '" aria-pressed="' + on + '"><span class="check">' + CK + "</span><div><b>" + esc(s.t) + (s.tag ? '<span class="tag">' + esc(s.tag) + "</span>" : "") + '</b><span class="why">' + esc(s.why) + '</span></div><span class="t">' + fmt(s.s) + "</span></button>";
      }).join("") + "</section>" +
      (done.length === list.length ? '<section class="complete glass"><b>' + (part === "am" ? "아침 정돈 완료" : "오늘 루틴 완료") + "</b><span>" + (part === "am" ? "저녁에 다시 만나요." : "연속 기록 " + streak() + "일째.") + "</span></section>" : '<p class="note">단계를 탭하면 완료로 체크돼요</p>')
    );
  }

  function renderGuide() {
    var p = state.profile, st = STYLES[p.style], sk = SKINS[p.skin];
    var base = [
      { c: sk.cleanser, d: sk.cdesc, pr: "1만원대" },
      { c: "무알코올 토너", d: "무향 · 대용량", pr: "1만원대" },
      { c: sk.moist, d: sk.ko + " 맞춤", pr: "1~2만원" },
      { c: "선크림 SPF50+", d: "백탁 적은 타입", pr: "1만원대" }
    ];
    var plus = p.concerns.map(function (c) { var pr = CONCERNS[c].prod; return { c: pr.c, d: CONCERNS[c].ko + " · " + pr.d, pr: pr.p, hot: true }; });
    function prod(x, i) { return '<div class="prod"><i class="num' + (x.hot ? " hot" : "") + '">' + (x.hot ? "+" : "") + (i + 1) + "</i><div><b>" + esc(x.c) + "</b><span>" + esc(x.d) + "</span></div><em>" + x.pr + "</em></div>"; }
    shell(
      '<div style="padding:6px 4px 0"><p class="eyebrow">' + sk.ko + " · " + st.ko + '</p><h1 class="title">처음엔<br><em>딱 이것만.</em></h1></div>' +
      '<div class="sec-h"><h3>기본 4가지</h3><span>PX 구매 가능</span></div>' +
      '<section class="glass" style="padding:6px 0">' + base.map(prod).join("") + "</section>" +
      (plus.length ? '<div class="sec-h"><h3>내 고민에 맞춰</h3><span>' + plus.length + "개</span></div>" + '<section class="glass" style="padding:6px 0">' + plus.map(prod).join("") + "</section>" : "") +
      '<div class="sec-h"><h3>' + st.ko + " 스타일 키트</h3><span>" + st.en + "</span></div>" +
      '<dl class="kit glass" style="margin:0"><div><dt>헤어</dt><dd><b>' + st.hair + "</b>" + st.hairTip + "</dd></div><div><dt>향</dt><dd><b>" + st.scent + "</b>은은하게 손목과 목 뒤 한 번씩.</dd></div><div><dt>옷</dt><dd><b>" + st.fit + "</b>사이즈만 맞아도 절반은 정돈됩니다.</dd></div></dl>" +
      '<p class="note">제품명 대신 종류로 안내해요. 피부과 검수 추천은 제휴 후 추가됩니다.</p>'
    );
  }

  function renderMe() {
    var p = state.profile, st = STYLES[p.style];
    var keys = Object.keys(state.log).filter(function (k) { return dayRatio(k) > 0; });
    var fulls = keys.filter(function (k) { return dayRatio(k) >= .99; }).length;
    var cal = "";
    for (var i = 27; i >= 0; i--) cal += '<span class="dot ' + cls(dayRatio(dkey(daysAgo(i)))) + '"></span>';
    shell(
      '<section class="me glass"><div class="me__icon"><svg class="mark" style="--chev:#111"><use href="#rb"/></svg></div><div><b>' + st.ko + "</b><span>" + st.line + "</span></div></section>" +
      '<section class="stats glass"><div><span class="num">' + streak() + '</span><span>연속</span></div><div><span class="num">' + keys.length + '</span><span>기록한 날</span></div><div><span class="num">' + fulls + '</span><span>완벽한 날</span></div></section>' +
      '<div class="sec-h"><h3>최근 4주</h3><span>' + (keys.length ? Math.round(fulls / Math.max(1, keys.length) * 100) + "% 완주" : "") + "</span></div>" +
      '<section class="cal glass">' + cal + "</section>" +
      '<div class="sec-h"><h3>내 프로필</h3></div>' +
      '<dl class="kit glass" style="margin:0"><div><dt>추구미</dt><dd><b>' + st.ko + "</b></dd></div><div><dt>피부</dt><dd><b>" + SKINS[p.skin].ko + "</b></dd></div><div><dt>고민</dt><dd><b>" + (p.concerns.map(function (c) { return CONCERNS[c].ko; }).join(", ") || "없음") + "</b></dd></div></dl>" +
      '<button class="link glass press" data-act="onboard">추구미 · 피부 다시 진단</button>' +
      '<button class="link press" data-act="reset" id="reset-btn">기록 전부 지우기</button>' +
      (state.sample ? '<p class="note">지금은 예시 기록이에요. 진단을 마치면 내 기록으로 새로 시작해요.</p>' : "")
    );
  }

  // ---------- 온보딩 ----------
  function renderOnboard(keepAnim) {
    var s = draft.step, body = "", ok = false;
    var bar = '<div class="prog">' + [0, 1, 2].map(function (i) { return '<i class="' + (i <= s ? "on" : "") + '"></i>'; }).join("") + "</div>";
    if (s === 0) {
      ok = !!draft.style;
      body = '<div style="padding:4px"><p class="eyebrow">1 / 3 · 추구미</p><h1 class="title">어떤 모습으로<br><em>보이고 싶어요?</em></h1></div><div class="styles">' +
        STYLE_KEYS.map(function (k) { var st = STYLES[k]; return '<button class="sty glass" data-style="' + k + '" aria-pressed="' + (draft.style === k) + '"><span class="o" style="background:' + st.orb + '"></span><small>' + st.en + "</small><b>" + st.ko + "</b><span>" + st.line + "</span></button>"; }).join("") + "</div>";
    } else if (s === 1) {
      ok = !!draft.skin;
      body = '<div style="padding:4px"><p class="eyebrow">2 / 3 · 피부</p><h1 class="title">세안 후 1시간,<br><em>얼굴은 어때요?</em></h1></div>' +
        SKIN_KEYS.map(function (k) { return '<button class="opt glass" data-skin="' + k + '" aria-pressed="' + (draft.skin === k) + '"><span class="r">' + CK + "</span><div><b>" + SKINS[k].q + "</b><span>" + SKINS[k].ko + "</span></div></button>"; }).join("");
    } else {
      ok = true;
      body = '<div style="padding:4px"><p class="eyebrow">3 / 3 · 고민</p><h1 class="title">요즘 신경 쓰이는 걸<br><em>모두 골라주세요</em></h1></div>' +
        CONCERN_KEYS.map(function (k) { var on = draft.concerns.indexOf(k) > -1; return '<button class="opt multi glass" data-concern="' + k + '" aria-pressed="' + on + '"><span class="r">' + CK + "</span><div><b>" + CONCERNS[k].ko + "</b><span>" + CONCERNS[k].sub + "</span></div></button>"; }).join("");
    }
    app.innerHTML = AMB + '<header class="top"><svg class="mark" aria-label="RE:BOOT"><use href="#rb"/></svg>' + '<button class="chip glass press" data-act="cancel">닫기</button>' + "</header>" +
      '<main class="view' + (keepAnim ? "" : " enter") + '" style="padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))">' + bar + body +
      '<div class="ob-foot"><button class="cta press" data-act="next"' + (ok ? "" : " disabled") + ">" + (s === 2 ? (draft.concerns.length ? "RE:BOOT 시작" : "고민 없음, 시작하기") : "다음") + "</button>" +
      (s > 0 ? '<button class="link press" data-act="back">이전</button>' : "") + "</div></main>";
  }

  function boot() {
    var st = STYLES[draft.style];
    var lines = [st.ko + " 추구미 불러오는 중", SKINS[draft.skin].ko + " 피부 루틴 구성 중", "준비 완료"];
    var el = document.createElement("div");
    el.className = "boot";
    el.innerHTML = '<div class="boot__mark"><svg class="mark"><use href="#rb"/></svg></div><div class="boot__bar"><i></i></div><p></p>';
    app.appendChild(el);
    var bi = el.querySelector("i"), lb = el.querySelector("p");
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var i = 0;
    (function tick() {
      lb.textContent = lines[i];
      bi.style.width = Math.round((i + 1) / lines.length * 100) + "%";
      i++;
      if (i < lines.length) setTimeout(tick, reduce ? 150 : 700);
      else setTimeout(function () {
        if (state.sample) state.log = {};
        state.profile = { style: draft.style, skin: draft.skin, concerns: draft.concerns };
        state.sample = false; state.tab = "home"; draft = null; lastTab = null;
        save(); render();
      }, reduce ? 200 : 750);
    })();
  }

  // ---------- 이벤트 ----------
  var resetArmed = false;
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var d = b.dataset;
    if (d.tab) { state.tab = d.tab; resetArmed = false; save(); render(); return; }
    if (d.style) { draft.style = d.style; renderOnboard(true); return; }
    if (d.skin) { draft.skin = d.skin; renderOnboard(true); return; }
    if (d.concern) { var c = draft.concerns, ix = c.indexOf(d.concern); if (ix > -1) c.splice(ix, 1); else c.push(d.concern); renderOnboard(true); return; }
    if (d.step !== undefined) {
      var log = todayLog(); if (!Array.isArray(log[state.part])) log[state.part] = [];
      var arr = log[state.part], n = +d.step, k = arr.indexOf(n);
      if (k > -1) arr.splice(k, 1); else arr.push(n);
      save();
      var y = document.getElementById("view").scrollTop; render(); document.getElementById("view").scrollTop = y;
      return;
    }
    if (d.part && !d.act) { state.part = d.part; lastTab = state.tab; save(); render(); return; }
    switch (d.act) {
      case "go-routine": state.tab = "routine"; state.part = d.part; save(); render(); break;
      case "onboard":
        var p = state.profile || {};
        draft = { step: 0, style: state.sample ? null : p.style, skin: state.sample ? null : p.skin, concerns: state.sample ? [] : (p.concerns || []).slice() };
        renderOnboard(); break;
      case "cancel": draft = null; lastTab = null; render(); break;
      case "back": draft.step--; renderOnboard(); break;
      case "next": if (draft.step < 2) { draft.step++; renderOnboard(); } else boot(); break;
      case "reset":
        if (!resetArmed) { resetArmed = true; b.textContent = "한 번 더 누르면 기록이 지워져요"; b.style.color = "var(--amber)"; }
        else { state.log = {}; resetArmed = false; save(); render(); }
        break;
    }
  });

  render();
})();
</script>
</body>
</html>
